name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nemsa
          POSTGRES_PASSWORD: nemsa
          POSTGRES_DB: nemsa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nemsa"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nemsa:nemsa@localhost:5432/nemsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile cli config --quiet
      - name: Build image
        run: docker compose --profile cli build nemsa
      - name: Start database and run CLI inside the container
        run: |
          docker compose up -d --wait db
          docker compose run --rm nemsa --help
          docker compose run --rm --entrypoint python nemsa -c \
            "import psycopg, os; psycopg.connect(os.environ['DATABASE_URL']).close(); print('db ok')"
      - name: Schema applied on first start
        run: docker compose exec -T db psql -U nemsa -d nemsa -c '\dt'
