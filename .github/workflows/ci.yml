name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nemsa
          POSTGRES_PASSWORD: nemsa
          POSTGRES_DB: nemsa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nemsa"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nemsa:nemsa@localhost:5432/nemsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
