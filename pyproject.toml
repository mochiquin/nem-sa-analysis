[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemsa"
version = "0.1.0"
description = "South Australian electricity market analysis built on public AEMO NEMweb data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "nemosis>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]

[project.scripts]
nemsa = "nemsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
