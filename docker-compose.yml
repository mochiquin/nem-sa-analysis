services:
  db:
    image: postgres:16
    container_name: nemsa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nemsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemsa}
      POSTGRES_DB: ${POSTGRES_DB:-nemsa}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is applied automatically the first time the volume is created.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemsa}"]
      interval: 5s
      retries: 10

  # The pipeline CLI. Run commands on demand, e.g.
  #   docker compose run --rm nemsa -v backfill --start 2025-10-01 --end 2025-11-01
  nemsa:
    build: .
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nemsa}:${POSTGRES_PASSWORD:-nemsa}@db:5432/${POSTGRES_DB:-nemsa}
      NEMSA_REGION: ${NEMSA_REGION:-SA1}
      NEMSA_CACHE_DIR: /app/data/raw
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
