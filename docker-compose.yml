services:
  db:
    image: postgres:16
    container_name: nemsa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nemsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemsa}
      POSTGRES_DB: ${POSTGRES_DB:-nemsa}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is applied automatically the first time the volume is created.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemsa}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
